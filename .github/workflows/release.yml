# Tag a version (git tag v0.3.0 && git push origin v0.3.0) and this builds the
# Linux desktop app (.deb), checks it, and publishes it as a GitHub Release
# with a checksum, so anyone can download and install it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build the .deb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"

      - name: Tools for packaging
        run: sudo apt-get update && sudo apt-get install -y imagemagick dpkg-dev

      - name: Install dependencies (with Electron)
        run: npm ci

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} but package.json says $version"; exit 1; }

      - name: Checks and tests
        run: npm run check && npm test

      - name: Build
        run: npm run dist

      - name: Check the package
        run: |
          deb=$(ls dist/friends_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -q './opt/friends/resources/app/server/server.js'
          (cd dist && sha256sum "$(basename "$deb")" > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: friends-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(node scripts/release-notes.js "${GITHUB_REF_NAME#v}")
          gh release create "${GITHUB_REF_NAME}" dist/*.deb dist/SHA256SUMS --title "Friends ${GITHUB_REF_NAME}" --notes "$notes"
