services:
  friends:
    build:
      context: .
      dockerfile: Dockerfile
    image: friends:latest
    container_name: friends-chat
    restart: unless-stopped
    ports:
      # Only this computer can open it. Use "3000:3000" (and set ALLOWED_HOSTS)
      # only if you want other devices on your network to reach it.
      - "127.0.0.1:3000:3000"
    # Lets the container reach an AI server on this computer, e.g. Ollama at
    # http://host.docker.internal:11434 (then run Ollama with OLLAMA_HOST=0.0.0.0)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=info
      - KEYRING_BACKEND=file
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - friends_data:/home/node/.config/friends
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  friends_data:
    driver: local
