services:
  friends:
    build:
      context: .
      dockerfile: Dockerfile
    image: friends:latest
    container_name: friends-chat
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - ALLOWED_HOSTS=*
      - LOG_LEVEL=info
      - KEYRING_BACKEND=file
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - friends_data:/home/node/.config/friends
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  friends_data:
    driver: local
